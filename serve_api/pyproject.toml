[project]
name = "cprmv"
version = "0.4.3"
description = "CPRMV - <short description>"
authors = [
  "Bas Kaptijn <bas.kaptijn@ictu.nl>",
  "Peter de Ruijter <peter.deruijter@ictu.nl>",
]
dependencies = [
  "fastapi[standard]",
  "rdflib",
  "parse",
  "lxml",
  "ciso8601",
  "fastmcp",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "pre-commit"]
tools = ["bandit", "black", "mypy", "ruff", "vulture"]

[tools.ruff]
line-length = 120
