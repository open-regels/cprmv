name: Release SBOM

# ICTU recommendation 10 asks for SBOMs of released versions, kept analysable.
# A promotion to `main` IS a release here: there are no tags and no GitHub
# Releases in this repository, so the commit on `main` is the released thing.
#
# Two copies, deliberately, because neither is sufficient alone:
#
#   - docs/sbom/cprmv-api-<version>.cdx.json, committed at release time by
#     `python scripts/write-sbom.py`. Durable: a question about a version that
#     shipped a year ago is answerable from git. Two checks below, of different
#     strength: on the release pull request -- the one that adds this
#     version's file -- it must match serve_api/requirements.txt exactly; on a
#     promotion it must exist, and drift is only a warning, because a promotion
#     carries later commits.
#   - the artifact this workflow uploads, which is what a scanner or a
#     Dependency-Track import can fetch without a checkout. This repository is
#     public, so GitHub caps artifact retention at 90 days -- hence the
#     committed copy.
#
# This covers the Python dependencies the image installs. The image's own
# Debian packages are in the BuildKit SBOM attestation that ci.yml attaches to
# the image in GHCR.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # So a change to the SBOM tooling is exercised on its own pull request,
  # rather than first running at a promotion.
  pull_request:
    paths:
      - '.github/workflows/sbom.yml'
      - 'scripts/write-sbom.py'
      - 'scripts/test/test_write_sbom.py'
      - 'docs/sbom/**'
      - 'serve_api/requirements.txt'
      - 'serve_api/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Not "audit" and not "sbom" alone: required checks match by name, and a
  # second job sharing a required context makes it ambiguous.
  release-sbom:
    permissions:
      contents: read
      # Read the pull request's file list, for the release-PR check below.
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # Both pins are by hand: cyclonedx-bom is listed in SECURITY-PIPELINE.md,
      # and pytest must match serve_api/requirements-dev.txt. The tool reads
      # the requirements file, so nothing of the application is installed.
      - name: Install the SBOM tooling
        run: python -m pip install cyclonedx-bom==8.0.1 pytest==9.1.1

      - name: Test the SBOM generator
        run: python -m pytest scripts/test/test_write_sbom.py

      # Both checks run BEFORE "Generate the SBOM". That step writes
      # docs/sbom/cprmv-api-<version>.cdx.json in the workspace, so a check
      # after it compares a fresh generation with itself and cannot fail.

      - name: The released version has an SBOM
        # Only on a promotion, and deliberately NOT the strict --check: a
        # promotion carries every commit merged into acc since the release, so
        # the requirements may have moved while the committed document is
        # still the right one for the version being released. --verify-release
        # fails when the file for this version is missing, and warns when it
        # has drifted. The strict check belongs where the release is cut.
        if: ${{ github.event_name == 'push' }}
        run: python scripts/write-sbom.py --verify-release

      - name: The release pull request's SBOM matches its requirements
        # Where the release is cut, the strict --check. Only on the pull
        # request that adds or changes THIS version's file, which is the
        # release bump: on any other pull request the committed file belongs to
        # an earlier release, and requirements that have moved since are
        # expected. Re-runs on every push to the pull request, since the paths
        # filter above matches its whole diff, so a rebase is checked too.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          sbom=$(python scripts/write-sbom.py --print-path)
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qxF "$sbom"; then
            python scripts/write-sbom.py --check
          else
            echo "$sbom is not changed by this pull request, so it is not a release bump; skipping the strict check."
          fi

      - name: Generate the SBOM
        # After the checks (see above): the uploaded copy describes this
        # commit's requirements, which on a promotion is what is deployed.
        run: python scripts/write-sbom.py

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: docs/sbom/*.cdx.json
          # The maximum GitHub allows on a public repository. The committed
          # copy is what survives beyond it.
          retention-days: 90
          if-no-files-found: error
