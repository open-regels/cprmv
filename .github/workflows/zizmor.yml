name: Supply-chain audit

# Deliberately no branches or paths filter on pull_request. `audit` is a required
# check, and a pull request that matched no trigger would carry no check at all.
on:
  pull_request:
  push:
    branches:
      - acc
      - main

permissions:
  contents: read

jobs:
  zizmor:
    # Required checks match by name. Renaming this job means updating the rulesets.
    name: audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # The action defaults to "latest". Update this after the action itself,
          # because the action only runs versions in its own digest table.
          version: '1.29.0'
          # SARIF upload would need security-events: write.
          advanced-security: false
          annotations: true
          online-audits: false

      # Every step below uses `if: always()`, so one run reports on every part of
      # the policy instead of stopping at the first failure.
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Validate renovate.json
        if: always()
        # Pinned by hand, because Renovate does not manage an inline npx argument.
        # No filename: passing one switches the validator to global config rules.
        run: npx --yes --package renovate@44.50.3 renovate-config-validator --strict
      - name: Set up Python
        if: always()
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Requirements match pyproject.toml
        if: always()
        # Recompiles on the runner with the same flags a developer uses, then fails
        # if the committed files differ: a hand-edited or stale lock file is caught.
        run: |
          pip install pip-tools==7.6.2
          cd serve_api
          ./pip-compile.sh
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Every requirement is hashed
        if: always()
        # --require-hashes makes pip refuse any entry without a hash; --dry-run
        # installs nothing.
        run: |
          pip install --dry-run --ignore-installed --require-hashes --no-deps -r serve_api/requirements.txt
          pip install --dry-run --ignore-installed --require-hashes --no-deps -r serve_api/requirements-dev.txt
