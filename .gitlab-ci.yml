# Development and CI live on GitHub (open-regels/cprmv). This file only publishes
# the ReSpec to https://standaarden.open-regels.nl/standards/cprmv/ when `main` is
# pushed to GitLab at a release. Nothing else runs here.
image: node:lts-alpine
create-pages:
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: html/public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    echo "ReSpec documentation is prebuilt."
